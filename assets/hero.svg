<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Fuel Gauge for Claude: two fuel dials, 5-hour window and week, with a red reserve zone at 95 percent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141816"/>
      <stop offset="1" stop-color="#0D100E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#F0A04B" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F0A04B" stop-opacity="0"/>
    </radialGradient>
    <g id="ticks" stroke="#8F9993" stroke-linecap="round">
      <line x1="-112" y1="0" x2="-126" y2="0" stroke-width="3"/>
      <line x1="-112" y1="0" x2="-121" y2="0" stroke-width="2" transform="rotate(22.5)"/>
      <line x1="-112" y1="0" x2="-121" y2="0" stroke-width="2" transform="rotate(45)"/>
      <line x1="-112" y1="0" x2="-121" y2="0" stroke-width="2" transform="rotate(67.5)"/>
      <line x1="-112" y1="0" x2="-126" y2="0" stroke-width="3" transform="rotate(90)"/>
      <line x1="-112" y1="0" x2="-121" y2="0" stroke-width="2" transform="rotate(112.5)"/>
      <line x1="-112" y1="0" x2="-121" y2="0" stroke-width="2" transform="rotate(135)"/>
      <line x1="-112" y1="0" x2="-121" y2="0" stroke-width="2" transform="rotate(157.5)"/>
      <line x1="-112" y1="0" x2="-126" y2="0" stroke-width="3" transform="rotate(180)"/>
    </g>
  </defs>
  <rect width="1280" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="20" fill="url(#glow)"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="118" fill="#8F9993" font-size="20" letter-spacing="4">UNOFFICIAL PLUGIN FOR CLAUDE</text>
    <text x="68" y="200" fill="#E6EAE6" font-size="84" font-weight="700" letter-spacing="-1">fuel-gauge</text>
    <text x="72" y="252" fill="#C9D0CB" font-size="28">Claude finally knows how much gas is left.</text>
    <g font-size="19" fill="#8F9993">
      <text x="72" y="316">Knows its own 5-hour and weekly limits</text>
      <text x="72" y="346">Shows them next to your prompt</text>
      <text x="72" y="376">Hard stop at 95% - you are never cut off mid-task</text>
    </g>
    <circle cx="60" cy="310" r="3" fill="#4FBF83"/>
    <circle cx="60" cy="340" r="3" fill="#E3B23C"/>
    <circle cx="60" cy="370" r="3" fill="#F06464"/>
  </g>

  <!-- Dial: 5h window (needle shows what is LEFT: E on the left, F on the right) -->
  <g transform="translate(850 262) scale(0.88)">
    <path d="M -100 0 A 100 100 0 0 1 100 0" fill="none" stroke="#262C28" stroke-width="16" stroke-linecap="round"/>
    <path d="M -100 0 A 100 100 0 0 1 -98.8 -15.6" fill="none" stroke="#F06464" stroke-width="16" opacity=".55"/>
    <path d="M -100 0 A 100 100 0 0 1 75.0 -66.1" fill="none" stroke="#4FBF83" stroke-width="16" stroke-linecap="round" opacity=".9"/>
    <use href="#ticks"/>
    <text x="-128" y="28" fill="#8F9993" font-family="Consolas, Menlo, monospace" font-size="16" text-anchor="middle">E</text>
    <text x="128" y="28" fill="#8F9993" font-family="Consolas, Menlo, monospace" font-size="16" text-anchor="middle">F</text>
    <g>
      <line x1="0" y1="0" x2="0" y2="-88" stroke="#F0A04B" stroke-width="5" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" values="90;-80;49;49" keyTimes="0;0.35;0.7;1" dur="3.2s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1;0.3 0 0.2 1;0 0 1 1"/>
    </g>
    <circle r="11" fill="#141816" stroke="#F0A04B" stroke-width="4"/>
    <text x="0" y="58" fill="#E6EAE6" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">77% left</text>
    <text x="0" y="-146" fill="#8F9993" font-family="Consolas, Menlo, monospace" font-size="16" letter-spacing="3" text-anchor="middle">5-HOUR WINDOW</text>
  </g>

  <!-- Dial: week -->
  <g transform="translate(1112 262) scale(0.88)">
    <path d="M -100 0 A 100 100 0 0 1 100 0" fill="none" stroke="#262C28" stroke-width="16" stroke-linecap="round"/>
    <path d="M -100 0 A 100 100 0 0 1 -98.8 -15.6" fill="none" stroke="#F06464" stroke-width="16" opacity=".55"/>
    <path d="M -100 0 A 100 100 0 0 1 -80.9 -58.8" fill="none" stroke="#E3B23C" stroke-width="16" stroke-linecap="round" opacity=".9"/>
    <use href="#ticks"/>
    <text x="-128" y="28" fill="#8F9993" font-family="Consolas, Menlo, monospace" font-size="16" text-anchor="middle">E</text>
    <text x="128" y="28" fill="#8F9993" font-family="Consolas, Menlo, monospace" font-size="16" text-anchor="middle">F</text>
    <g>
      <line x1="0" y1="0" x2="0" y2="-88" stroke="#F0A04B" stroke-width="5" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" values="90;-80;-54;-54" keyTimes="0;0.35;0.7;1" dur="3.2s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1;0.3 0 0.2 1;0 0 1 1"/>
    </g>
    <circle r="11" fill="#141816" stroke="#F0A04B" stroke-width="4"/>
    <text x="0" y="58" fill="#E6EAE6" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle">20% left</text>
    <text x="0" y="-146" fill="#8F9993" font-family="Consolas, Menlo, monospace" font-size="16" letter-spacing="3" text-anchor="middle">WEEK</text>
  </g>
</svg>
